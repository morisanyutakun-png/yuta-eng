<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Solvora Learning Lab">
  <defs>
    <linearGradient id="sm-sigma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d4a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sm-swoosh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="sm-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbe5fb"/>
    </linearGradient>
  </defs>

  <!-- Open book base -->
  <g>
    <path d="M16 84 Q 60 74 60 84 L60 102 Q 60 96 16 106 Z"
          fill="url(#sm-page)" stroke="#0b1d4a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M104 84 Q 60 74 60 84 L60 102 Q 60 96 104 106 Z"
          fill="url(#sm-page)" stroke="#0b1d4a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M24 92 Q 42 89 56 91" stroke="#1d4ed8" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M64 91 Q 78 89 96 92" stroke="#1d4ed8" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Teal swoosh behind Σ -->
  <path d="M40 24 Q 92 36 84 78"
        fill="none" stroke="url(#sm-swoosh)" stroke-width="6.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Sigma -->
  <path d="M40 22 L80 22 L56 47 L80 80 L40 80"
        fill="none" stroke="url(#sm-sigma)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Atom orbit + electron -->
  <g transform="translate(36 64) rotate(-22)">
    <ellipse cx="0" cy="0" rx="14" ry="5" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
    <circle cx="-11" cy="1.5" r="3" fill="#38bdf8"/>
  </g>

  <!-- Sparkle star -->
  <g transform="translate(90 26)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#f59e0b"/>
  </g>
</svg>
