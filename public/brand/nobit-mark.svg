<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="ノビットスタディ Nobit Study">
  <defs>
    <linearGradient id="nm-arrow" x1="0.05" y1="0.95" x2="0.95" y2="0.1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.5" stop-color="#0d9488"/>
      <stop offset="0.8" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="nm-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="url(#nm-tile)"/>

  <!-- Rising swoosh (growth arrow): blue → teal → green → orange -->
  <path d="M24 90 Q 40 96 56 80 Q 76 60 86 38"
        fill="none" stroke="url(#nm-arrow)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrowhead at the tip (orange) -->
  <path d="M68 36 L88 34 L86 56"
        fill="none" stroke="#f97316" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Orange 4-point spark -->
  <path d="M99 24 L102 32 L110 35 L102 38 L99 46 L96 38 L88 35 L96 32 Z" fill="#f97316"/>
  <!-- Sky diamond spark -->
  <path d="M74 18 L76.5 24 L82 26.5 L76.5 29 L74 35 L71.5 29 L66 26.5 L71.5 24 Z" fill="#38bdf8"/>
</svg>
